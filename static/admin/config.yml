backend:
  name: git-gateway
  branch: development # Branch to update (optional; defaults to master)
local_backend: true # run npx netlify-cms-proxy-server for local testing
media_folder: static/uploads
public_folder: /uploads
collections:
  - name: "writing"
    label: "Writing"
    folder: "content/writing"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          default: "{{now}}",
          format: "YYYY-MM-DD",
          timeFormat: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean" }
      - {
          label: "Tag",
          name: "tags",
          widget: "select",
          options: ["technology", "digital marketing", "lifestyle"],
        }
      - { label: "Image", name: "image", widget: "file" }
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
