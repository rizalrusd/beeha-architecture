<header x-data="navbar()" class="fixed top-0 left-0 right-0 z-50">
  <nav class="flex justify-between items-center bg-white-default p-8 py-6">
    <div>
      <a href="/"
        ><img class="w-12 opacity-60" src="/images/logo.png" alt="beeha's logo"
      /></a>
    </div>
    <div class="sm:hidden">
      <button
        class="p-1 rounded-md flex items-center justify-center"
        x-cloak
        x-on:click="toggle()"
      >
        <svg
          x-bind:class="isOpen && 'hidden'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
        >
          <path
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M4 8.5h16m-16 7h16"
            color="currentColor"
          />
        </svg>
        <svg
          x-bind:class="!isOpen && 'hidden'"
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12z"
          />
        </svg>
      </button>
    </div>
    <ul class="sm:flex gap-6 hidden text-sm">
      <li>
        <a class="hover:underline underline-offset-2" href="/project"
          >Project</a
        >
      </li>
      <li>
        <a class="hover:underline underline-offset-2" href="/about">About</a>
      </li>
      <li>
        <a class="hover:underline underline-offset-2" href="/contact"
          >Contact</a
        >
      </li>
    </ul>
  </nav>

  <div
    x-cloak
    class="bg-white-default fixed pt-[5rem] inset-0 px-8 duration-700 ease-in-out -z-10 sm:hidden"
    x-bind:class="isOpen ? 'opacity-100 pointer-events-auto':'opacity-0 pointer-events-none'"
  >
    <ul class="flex flex-col gap-6 text-sm">
      <li>
        <a href="/project">Project</a>
      </li>
      <li>
        <a href="/about">About</a>
      </li>
      <li>
        <a href="/contact">Contact</a>
      </li>
    </ul>
  </div>
</header>
