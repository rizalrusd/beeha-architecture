{{ define "main" }}
  <section class="flex flex-col gap-24">
    <div class="flex flex-col gap-8 md:max-w-[520px] md:mx-auto">
      <div class="uppercase flex flex-col gap-2">
        <span class="text-sm">About</span>
        <h1>Beeha Studio</h1>
      </div>
      <p>
        {{ .Params.about }}
      </p>
      <button
        class="border p-4 dark:border-white-default/60 border-black-default/60 hover:translate-x-1 duration-300 ease-in-out"
      >
        Get in touch
      </button>
    </div>
    <div class="flex flex-col gap-4">
      <div class="flex justify-between">
        <h1 class="heading uppercase">Beeha Teams</h1>
        <span class="flex items-center gap-2 md:hidden"
          >scroll
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
          >
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M4 12h16m0 0l-6-6m6 6l-6 6"
            />
          </svg>
        </span>
      </div>
      <div class="overflow-x-auto md:overflow-visible no-scroll">
        <div class="flex gap-4">
          {{ range .Params.teams }}
            <div class="shrink-0 flex flex-col gap-2">
              <img
                class="aspect-[5/6] w-[16rem] object-cover"
                src="{{ .pict }}"
                alt="{{ .name }}"
              />
              <div>
                <h1 class="content-heading">{{ .name }}</h1>
                <h2 class="content-subheading">{{ .role }}</h2>
              </div>
            </div>
          {{ end }}
        </div>
      </div>
    </div>
  </section>
{{ end }}
