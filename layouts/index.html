{{ define "main" }}
  <section x-data="slideshow">
    <div
      x-ref="splashscreen"
      class="bg-black-default fixed inset-0 opacity-0 duration-1000 ease-in-out z-10"
    ></div>
    <img
      x-on:load="onContentLoaded()"
      class="fixed inset-0 w-full h-full object-cover"
      x-ref="slide"
    />
  </section>
{{ end }}

{{ define "script" }}
  {{ $highlight := .Params.highlight }}
  <script id="data" type="application/json">
    [
      {{range $index, $slides := $highlight}}
        {{ $slides }} {{ if ne (add $index 1) (len $highlight) }},{{ end }}
      {{end}}
    ]
  </script>
  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("slideshow", () => ({
        images: JSON.parse(document.getElementById("data").textContent),
        currentIndex: 0,
        interval: 8000,
        init() {
          this.$refs.slide.src = this.images[this.currentIndex];
          this.$refs.slide.alt = this.images[this.currentIndex];

          this.slideshow();
        },

        slideshow() {
          const splash = this.$refs.splashscreen;
          setTimeout(() => {
            splash.classList.replace("opacity-0", "opacity-100");
            setTimeout(() => {
              this.currentIndex =
                this.currentIndex == this.images.length - 1
                  ? 0
                  : this.currentIndex + 1;

              this.$refs.slide.src = this.images[this.currentIndex];
              this.$refs.slide.alt = this.images[this.currentIndex];
            }, 1000);
          }, this.interval);
        },

        onContentLoaded() {
          const splash = this.$refs.splashscreen;
          splash.classList.replace("opacity-100", "opacity-0");
          setTimeout(() => {
            this.slideshow();
          }, this.interval);
        },
      }));
    });
  </script>
{{ end }}
